[workspace]
resolver = "2"
members = [
    "crates/rekha-core",
    "crates/rekha-distance",
    "crates/rekha-index",
    "crates/rekha-storage",
    "crates/rekha-wal",
    "crates/rekha-cluster",
    "crates/rekha-repl",
    "crates/rekha-objectstore",
    "crates/rekha-engine",
    "crates/rekha-api",
    "crates/rekha-cli",
    "crates/rekha-bench",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
wide = "1"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
metrics = "0.21"
metrics-exporter-prometheus = { version = "0.13", features = ["http-listener"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
subtle = "2"
parking_lot = "0.12"
proptest = "1"

[workspace.lints.rust]
unused = "deny"
dead_code = "deny"
