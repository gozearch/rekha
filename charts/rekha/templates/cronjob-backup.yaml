{{- if .Values.backup.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rekha.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rekha.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "rekha.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  BACKUP_DIR="/backups/rekha-$(date +%Y%m%d-%H%M%S)"
                  echo "Creating sealed backup into ${BACKUP_DIR}..."
                  rekha backup --data-dir /data --out "${BACKUP_DIR}"
                  echo "Backup completed successfully."
                  # Cleanup backups older than retentionDays
                  find /backups -maxdepth 1 -type d -name "rekha-*" -mtime +{{ .Values.backup.retentionDays }} -exec rm -rf {} + || true
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-{{ include "rekha.fullname" . }}-0
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "rekha.fullname" . }}-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rekha.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rekha.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.backup.persistence.storageClass }}
  storageClassName: {{ .Values.backup.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size | quote }}
{{- end }}
