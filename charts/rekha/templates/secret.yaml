{{- if not .Values.auth.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rekha.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rekha.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.apiKey }}
  REKHA_API_KEY: {{ .Values.auth.apiKey | quote }}
  {{- else }}
  REKHA_API_KEY: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.auth.clusterSecret }}
  REKHA_CLUSTER_SECRET: {{ .Values.auth.clusterSecret | quote }}
  {{- else }}
  REKHA_CLUSTER_SECRET: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.auth.keyPepper }}
  REKHA_KEY_PEPPER: {{ .Values.auth.keyPepper | quote }}
  {{- end }}
{{- end }}
