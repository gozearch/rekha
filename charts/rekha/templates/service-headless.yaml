apiVersion: v1
kind: Service
metadata:
  name: {{ include "rekha.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rekha.labels" . | nindent 4 }}
  {{- with .Values.headlessService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
      protocol: TCP
    - name: internal
      port: {{ .Values.ports.internal }}
      targetPort: internal
      protocol: TCP
  selector:
    {{- include "rekha.selectorLabels" . | nindent 4 }}
