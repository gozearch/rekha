# Coverage is a gate, not a report.
#
# `target: auto` compares against the base commit, and `threshold: 0%` forbids
# any drop. Combined with `fail_ci_if_error: true` in the workflow, a PR that
# removes coverage fails — which is the only thing that makes the number mean
# anything.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: false
    patch:
      default:
        target: auto
        threshold: 0%
        informational: false

comment:
  layout: "reach, diff, files"
  require_changes: false
