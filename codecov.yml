# Coverage is a gate, not a report.
#
# `target: 85%` is the same floor `scripts/coverage-threshold.py` enforces in
# CI, so the number a contributor measures locally is the number the PR shows.
# The small threshold allows noise from a platform-specific branch while still
# failing a change that removes real coverage.
coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
        informational: false
    patch:
      default:
        target: auto
        threshold: 0%
        informational: false

comment:
  layout: "reach, diff, files"
  require_changes: false
