[package]
name = "rekha-repl"
description = "RekhaDB interactive REPL — psql-style terminal client."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rekha-repl"
path = "src/main.rs"

[dependencies]
rekha-core = { path = "../rekha-core" }
reedline = "0.49"
ratatui = "0.30"
crossterm = "0.29"
nu-ansi-term = "0.50"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
