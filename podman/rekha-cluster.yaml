          value: /data
        - name: REKHA_PORT
          value: "8000"
        - name: REKHA_NODE_ID
          value: "2"
        - name: REKHA_PEERS
          value: "1@node1:8000,2@node2:8000,3@node3:8000"
        - name: REKHA_API_KEY
          value: "replace-me-with-32-random-characters"
        - name: REKHA_CLUSTER_SECRET
          value: "replace-me-cluster-secret-32-bytes"
      readinessProbe:
        httpGet:
          path: /ready
          port: 8000
        initialDelaySeconds: 5
