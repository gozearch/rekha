syntax = "proto3";

package rekha;

service Rekha {
    rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
    rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
    rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
    rpc CollectionExists(CollectionExistsRequest) returns (CollectionExistsResponse);

    rpc Insert(InsertRequest) returns (InsertResponse);
    rpc InsertBatch(stream InsertRequest) returns (InsertBatchResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc Fetch(FetchRequest) returns (FetchResponse);

    rpc Search(SearchRequest) returns (SearchResponse);
    rpc SearchStream(SearchRequest) returns (stream ScoredPoint);
    rpc SearchDimRange(SearchDimRangeRequest) returns (SearchDimRangeResponse);

    rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc TransferShard(TransferShardRequest) returns (stream TransferShardChunk);
}

message Vector {
    uint64 id = 1;
    repeated float data = 2;
}

message Payload {
    string content_type = 1;
    bytes data = 2;
}

message ScoredPoint {
    uint64 id = 1;
    float score = 2;
    optional Payload payload = 3;
}

message InsertRequest {
    uint64 id = 1;
    repeated float vector = 2;
    optional Payload payload = 3;
    string collection_name = 4;
    bool is_replication = 5;
}

message InsertResponse {
    uint64 id = 1;
    bool success = 2;
    string error = 3;
}

message InsertBatchResponse {
    uint64 inserted_count = 1;
    repeated string errors = 2;
}

message DeleteRequest {
    repeated uint64 ids = 1;
    string collection_name = 2;
}

message DeleteResponse {
    uint64 deleted_count = 1;
    string error = 2;
}

message FetchRequest {
    repeated uint64 ids = 1;
    bool include_payloads = 2;
    string collection_name = 3;
}

message FetchResponse {
    repeated Vector vectors = 1;
    repeated ScoredPoint points = 2;
    string error = 3;
}

message SearchParams {
    uint32 ef_search = 1;
    uint32 nprobe = 2;
    bool include_payloads = 3;
}

message SearchRequest {
    repeated float query_vector = 1;
    uint32 top_k = 2;
    SearchParams params = 3;
    bool local_only = 4;
    string collection_name = 5;
}

message SearchStats {
    double total_ms = 1;
    uint32 nodes_contacted = 2;
    uint64 vectors_scanned = 3;
    repeated string warnings = 4;
}

message SearchResponse {
    repeated ScoredPoint results = 1;
    SearchStats stats = 2;
}

message SearchDimRangeRequest {
    repeated float query_vector = 1;
    uint32 top_k = 2;
    uint32 dim_start = 3;
    uint32 dim_end = 4;
    uint32 nprobe = 5;
    string collection_name = 6;
}

message SearchDimRangeResponse {
    repeated ScoredPoint results = 1;
}

message NodeInfo {
    string node_id = 1;
    string address = 2;
    uint64 partition_id = 3;
    repeated uint32 dim_groups = 4;
    uint64 storage_bytes = 5;
    string status = 6;
}

message HandshakeRequest {
    string node_id = 1;
    string address = 2;
}

message HandshakeResponse {
    string cluster_id = 1;
    repeated NodeInfo peers = 2;
    string error = 3;
}

message HeartbeatRequest {
    string node_id = 1;
    string address = 2;
    uint64 storage_bytes = 3;
}

message HeartbeatResponse {
    bool success = 1;
}

message TransferShardRequest {
    uint64 shard_id = 1;
    string collection_name = 2;
    string target_node_id = 3;
}

message TransferShardChunk {
    repeated Vector centroids = 1;
    uint32 nlist = 2;
    uint32 nprobe = 3;
    uint32 total_dim = 4;
    repeated VectorBatch vector_batches = 5;
    bool final_chunk = 6;
}

message VectorBatch {
    repeated VectorWithCluster vectors = 1;
}

message VectorWithCluster {
    uint64 id = 1;
    repeated float data = 2;
    uint32 cluster_id = 3;
    optional bytes payload = 4;
}

message CollectionConfig {
    uint32 dim = 1;
    uint64 num_vector_shards = 2;
    uint64 replication_factor = 3;
    uint32 num_dim_groups = 4;
    uint32 dim_group_size = 5;
    uint32 nlist = 6;
    uint32 nprobe = 7;
    uint32 pq_num_sub_vectors = 8;
    uint32 pq_num_centroids = 9;
    uint32 re_rank_k = 10;
}

message CollectionInfo {
    string name = 1;
    CollectionConfig config = 2;
    uint64 vector_count = 3;
    bool index_ready = 4;
}

message CreateCollectionRequest {
    string name = 1;
    CollectionConfig config = 2;
    bool is_replication = 3;
}

message CreateCollectionResponse {
    bool success = 1;
    string error = 2;
}

message DropCollectionRequest {
    string name = 1;
}

message DropCollectionResponse {
    bool success = 1;
    string error = 2;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
    repeated CollectionInfo collections = 1;
}

message CollectionExistsRequest {
    string name = 1;
}

message CollectionExistsResponse {
    bool exists = 1;
}
