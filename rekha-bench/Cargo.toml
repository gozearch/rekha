[package]
name = "rekha-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Benchmarks for the Rekha vector database"
keywords = ["vector-database", "ann", "benchmarks", "nearest-neighbor"]
categories = ["database", "data-structures"]

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-index = { path = "../rekha-index" }
rekha-quant = { path = "../rekha-quant" }
rekha-partition = { path = "../rekha-partition" }
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "index_bench"
harness = false

[[bench]]
name = "quant_bench"
harness = false
