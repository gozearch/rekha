[package]
name = "rekha-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line interface for the Rekha vector database"
keywords = ["vector-database", "ann", "cli", "nearest-neighbor"]
categories = ["database", "data-structures"]

[[bin]]
name = "rekha"
path = "src/main.rs"

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-client = { path = "../rekha-client" }
rekha-server = { path = "../rekha-server" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
