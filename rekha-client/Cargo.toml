[package]
name = "rekha-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rust SDK for Rekha vector database"
keywords = ["vector-database", "ann", "client"]
categories = ["database", "data-structures"]

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-proto = { path = "../rekha-proto" }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"

[dev-dependencies]
tempfile = "3"
