[package]
name = "rekha-client"
version.workspace = true
edition.workspace = true

[dependencies]
rekha-core = { path = "../rekha-core" }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
proptest = "1"
tokio-test = "0.4"
rand = "0.8"

[build-dependencies]
tonic-build = "0.12"
