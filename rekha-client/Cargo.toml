[package]
name = "rekha-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "gRPC client for the Rekha distributed vector database"
keywords = ["vector-database", "ann", "client", "grpc", "nearest-neighbor"]
categories = ["database", "data-structures"]

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-proto = { path = "../rekha-proto" }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
proptest = "1"
tokio-test = "0.4"
rand = "0.8"
