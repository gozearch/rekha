[package]
name = "rekha-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Disk-based IVF+PQ index for the Rekha vector database"
keywords = ["vector-database", "ann", "indexing", "ivf", "pq", "nearest-neighbor"]
categories = ["database", "data-structures"]

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-storage = { path = "../rekha-storage" }
rekha-quant = { path = "../rekha-quant" }
serde = { version = "1", features = ["derive"] }
rocksdb = "0.22"

[dev-dependencies]
tempfile = "3"
