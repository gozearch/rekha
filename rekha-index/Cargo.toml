[package]
name = "rekha-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "IVF+PQ indexing for the Rekha vector database"
keywords = ["vector-database", "ann", "indexing", "ivf", "pq", "nearest-neighbor"]
categories = ["database", "data-structures"]

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-storage = { path = "../rekha-storage" }
rekha-quant = { path = "../rekha-quant" }
serde = { version = "1", features = ["derive"] }
log = "0.4"
fnv = "1"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
proptest = "1"
