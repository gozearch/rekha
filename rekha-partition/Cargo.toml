[package]
name = "rekha-partition"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Partition management and replication for the Rekha vector database"
keywords = ["vector-database", "ann", "partitioning", "replication", "nearest-neighbor"]
categories = ["database", "data-structures"]

[dependencies]
rekha-core = { path = "../rekha-core" }
serde = { version = "1", features = ["derive"] }

log = "0.4"
fnv = "1"
rand = "0.8"

[dev-dependencies]
approx = "0.5"
proptest = "1"
