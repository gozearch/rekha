[package]
name = "rekha-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared protobuf types and converters for Rekha"
keywords = ["vector-database", "protobuf"]
categories = ["database"]

[dependencies]
rekha-core = { path = "../rekha-core" }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
prost = "0.13"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
tonic-build = "0.12"
