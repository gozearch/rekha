[package]
name = "rekha-py"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-client = { path = "../rekha-client" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3", "abi3-py38"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
