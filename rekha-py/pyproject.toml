[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rekha"
version = "0.1.0"
description = "Rekha - Distributed Vector Database SDK"
requires-python = ">=3.8"

[project.urls]
homepage = "https://github.com/your-org/rekha"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "rekha"
