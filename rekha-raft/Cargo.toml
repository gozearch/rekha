[package]
name = "rekha-raft"
version.workspace = true
edition.workspace = true

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-storage = { path = "../rekha-storage" }
rocksdb = { version = "0.22", features = ["lz4"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rand = "0.8"
async-trait = "0.1"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
proptest = "1"
tokio-test = "0.4"
