[package]
name = "rekha-raft"
version.workspace = true
edition.workspace = true

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-storage = { path = "../rekha-storage" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
proptest = "1"
tokio-test = "0.4"
