[package]
name = "rekha-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "gRPC server for the Rekha distributed vector database"
keywords = ["vector-database", "ann", "server", "grpc", "nearest-neighbor"]
categories = ["database", "data-structures"]

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-storage = { path = "../rekha-storage" }
rekha-index = { path = "../rekha-index" }
rekha-proto = { path = "../rekha-proto" }
rekha-replication = { path = "../rekha-replication" }
rekha-cluster = { path = "../rekha-cluster" }
rekha-coordinator = { path = "../rekha-coordinator" }
rekha-client = { path = "../rekha-client" }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
tempfile = "3"

[dev-dependencies]
approx = "0.5"
proptest = "1"
tokio-test = "0.4"
rand = "0.8"


