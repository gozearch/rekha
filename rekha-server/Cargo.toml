[package]
name = "rekha-server"
version.workspace = true
edition.workspace = true

[dependencies]
rekha-core = { path = "../rekha-core" }
rekha-storage = { path = "../rekha-storage" }
rekha-index = { path = "../rekha-index" }
rekha-partition = { path = "../rekha-partition" }
rekha-raft = { path = "../rekha-raft" }
rekha-client = { path = "../rekha-client" }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"


[dev-dependencies]
approx = "0.5"
tempfile = "3"
proptest = "1"
tokio-test = "0.4"
rand = "0.8"

[build-dependencies]
tonic-build = "0.12"
