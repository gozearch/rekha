[package]
name = "rekha-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Persistent storage layer for the Rekha vector database"
keywords = ["vector-database", "ann", "storage", "nearest-neighbor"]
categories = ["database", "data-structures"]

[dependencies]
rekha-core = { path = "../rekha-core" }
byteorder = "1"
serde_json = "1"
bincode = "1"
rocksdb = "0.22"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
