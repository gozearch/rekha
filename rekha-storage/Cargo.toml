[package]
name = "rekha-storage"
version.workspace = true
edition.workspace = true

[dependencies]
rekha-core = { path = "../rekha-core" }
rocksdb = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
byteorder = "1"
bincode = "1"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
proptest = "1"
rand = "0.8"
