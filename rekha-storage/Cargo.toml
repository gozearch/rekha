[package]
name = "rekha-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Persistent storage layer using RocksDB for the Rekha vector database"
keywords = ["vector-database", "ann", "storage", "rocksdb", "nearest-neighbor"]
categories = ["database", "data-structures"]

[dependencies]
rekha-core = { path = "../rekha-core" }
rocksdb = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["sync"] }
byteorder = "1"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
proptest = "1"
rand = "0.8"
rekha-core = { path = "../rekha-core" }
